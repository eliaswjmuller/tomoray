# 3D VQGAN feature extractor (from-scratch training recipe).
seed: 1
batch_size: 4               # per GPU
num_workers: 8
name: vq_gan_3d
gpus: 3                     # DDP device count (>1 uses DDP)
accumulate_grad_batches: 1
default_root_dir: /home/user/Desktop/tomoray/vqgan_runs
default_root_dir_postfix: ''
resume_from_checkpoint:
max_steps: -1
max_epochs: 300
precision: bf16-mixed       # bf16 mixed precision (no loss scaler needed)
gradient_clip_val: 1.0
save_every_n_steps: 5000
check_val_every_n_epoch: 1

bottleneck: continuous      # continuous | fsq | vq (vq = checkpoints before 2026-10)
latent_noise: 0.1           # continuous: decoder sees + U(0, this) x latent std noise
fsq_levels: [15, 15, 15, 15, 15, 15, 15, 15]   # fsq: odd grid levels, one per channel
embedding_dim: 8
n_codes: 4096               # vq only (and restart_thres, no_random_restart)
n_hiddens: 16
lr: 3e-5
downsample: [2, 2, 2]
disc_channels: 64
disc_layers: 3
discriminator_iter_start: 2000
disc_loss_type: hinge
image_gan_weight: 1.0
video_gan_weight: 1.0
l1_weight: 4.0
gan_feat_weight: 4.0
perceptual_weight: 1.0
i3d_feat: False
restart_thres: 1.0
no_random_restart: False
norm_type: group
padding_type: replicate
num_groups: 8
