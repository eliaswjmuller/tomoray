name: diffusion_brain_w0_80_cond_5view_dim192
diffusion: GaussianDiffusion
denoising_fn: Unet3D


# Brain-window VQGAN, internal fine-tune (frozen 2026-08-26 at epoch 561, the measured
# plateau). Window [0,80]. Internal TEST core MAE 3.75 HU, slope 0.935, sigma 5.64;
# rsna 2.17 HU. DDPM lives in its latent space.
vqgan_ckpt: '/home/user/Desktop/tomoray/vqgan_runs/internal_w0_80_from_ep77__sp128x128x96/checkpoints/best-561-40464-0.0661.ckpt'

seed: 1

# Latent = 8 x 48 x 64 x 64 (f,h,w) from 96x128x128 input, downsample [2,2,2].
diffusion_img_size: 64      # h = w
diffusion_depth_size: 48    # f (non-cubic)
diffusion_num_channels: 8

# Latent standardization -> x0 ~ N(0,1). Tied to vqgan_ckpt above; re-measure if it
# changes. Replaces the old codebook min/max normalization, which gave std 0.072
# because ~95% of the 4096 codes are dead (perplexity ~220) and set the min/max.
# Re-measured 2026-08-26 over 48 volumes of the [0,80] DRR set for the checkpoint above.
# The old wide-window values were mean -0.1517 / std 2.3610 -- std is off by 2.3x, which
# would have silently rescaled the diffusion target rather than raising an error.
latent_mean: -0.2772
latent_std: 5.5407

# Cone-beam geometry for Fusion. MUST match data/generate_drr_brain.py.
fusion:
  num_views: 5
  total_deg: 180.0
  start_deg: 0.0
  endpoint: false           # -> [0,36,72,108,144] deg
  sdd: 1000.0
  sid: 500.0
  det: 256
  delx: 3.0
  vol_spacing: 4.0          # latent voxel mm (2x the 2mm CT)

dim: 192                    # ~298M-param U-Net; ~46GB/2-sample fp32, sized for 4x96GB
dim_mults: [1, 2, 4, 8]


batch_size: 2               # per GPU; dim=192 attention OOMs above ~3 on 96GB
train_lr: 1e-4              # was 3e-4; grads are now 3x larger (accum double-divide fixed)
train_num_steps: 100000   # plan says ~80k (flat from 70k; 70k->150k moved val 0.0018);
                          # 100k leaves headroom, and it can be stopped early
gradient_accumulate_every: 3   # eff. batch = 2 x 3 GPUs x 3 = 18
max_grad_norm: 1.0          # unclipped grads blew the run up to NaN at ~step 8k
ema_decay: 0.995
amp: True                   # bf16 on Blackwell


timesteps: 1000
sampling_timesteps: 250
loss_type: l2
objective: pred_noise
cond_scale: 2.0            # brain-HU optimum (n=12, flat 1.0-2.0); 3.0 wins only on
                           # re-projection/global MAE, which favour over-guidance


results_folder: '/home/user/Desktop/tomoray/ddpm_runs'   # adjacent to vqgan_runs
results_folder_postfix: 'diffusion_experiment'
load_milestone: -1 
save_and_sample_every: 1000

num_workers: 10
gpus: 0
logger: tensorboard
