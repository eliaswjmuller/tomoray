name: diffusion_brain_w0_100_cond_5view_a0_120_3d_dim128
diffusion: GaussianDiffusion
denoising_fn: Unet3D


# Brain-window VQGAN at [0,100]. ??? until the [0,100] fine-tune is scored (NEXT_STEPS.md,
# "Retarget"); Hydra refuses to start on ???, so the [0,80] values cannot leak in.
# Previous: internal_w0_80_from_ep77 best-561 ([0,80], internal TEST core MAE 3.75 HU).
vqgan_ckpt: ???

seed: 1

# Latent = 8 x 48 x 64 x 64 (f,h,w) from 96x128x128 input, downsample [2,2,2].
diffusion_img_size: 64      # h = w
diffusion_depth_size: 48    # f (non-cubic)
diffusion_num_channels: 8

# Latent standardization -> x0 ~ N(0,1). Tied to vqgan_ckpt above; re-measure if it
# changes. Replaces the old codebook min/max normalization, which gave std 0.072
# because ~95% of the 4096 codes are dead (perplexity ~220) and set the min/max.
# Measure with train/measure_latent_stats.py AFTER repointing brain_drr.yaml.
# [0,80] best-561 was -0.2772 / 5.5407; wide window -0.1517 / 2.3610.
latent_mean: ???
latent_std: ???

# Cone-beam geometry for Fusion. MUST match data/generate_drr_brain.py.
fusion:
  num_views: 5
  total_deg: 120.0
  start_deg: 0.0
  endpoint: true            # -> [0,30,60,90,120] deg, medical requirement (was 0-144)
  sdd: 1000.0
  sid: 500.0
  det: 256
  delx: 3.0
  vol_spacing: 4.0          # latent voxel mm (2x the 2mm CT)
  n_features: 128           # per view
  aggregate: concat         # mean -> 128 cond channels; concat -> 5 x 128 = 640
  supersample: 2            # 2^3 samples per 4 mm voxel (~2 mm); 1 = centre only
  fp32: true                # Fusion outside bf16 autocast

dim: 128                    # full_3d + cond_inject: 390M params; was dim 192 / 298M pseudo-3D
dim_mults: [1, 2, 4, 8]
full_3d: true               # 3x3x3 convs, depth 48->24->12->6, 3D attention at the bottleneck
cond_inject: true           # F into every U-Net resolution via zero-init projections


batch_size: 2               # per GPU; the ~3 OOM limit was dim192 pseudo-3D -- re-measure
train_lr: 1e-4              # was 3e-4; grads are now 3x larger (accum double-divide fixed)
train_num_steps: 100000   # plan says ~80k (flat from 70k; 70k->150k moved val 0.0018);
                          # 100k leaves headroom, and it can be stopped early
gradient_accumulate_every: 3   # eff. batch = 2 x 3 GPUs x 3 = 18
max_grad_norm: 1.0          # unclipped grads blew the run up to NaN at ~step 8k
ema_decay: 0.995
amp: True                   # bf16 on Blackwell


timesteps: 1000
sampling_timesteps: 250
loss_type: l2
objective: pred_noise
cond_scale: 2.0            # brain-HU optimum (n=12, flat 1.0-2.0); 3.0 wins only on
                           # re-projection/global MAE, which favour over-guidance


results_folder: '/home/user/Desktop/tomoray/ddpm_runs'   # adjacent to vqgan_runs
results_folder_postfix: 'diffusion_experiment'
load_milestone: -1 
save_and_sample_every: 1000

num_workers: 10
gpus: 0
logger: tensorboard
