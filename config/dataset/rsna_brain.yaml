name: rsna2019_clean
# RSNA reconstruction NIfTIs (output of the data/rsna_2019 pipeline).
root_dir: /home/user/Desktop/tomoray/datasets/Brain_RSNA_2019/brain_rsna_2019/nifti

# Relative to root_dir, or absolute. Same subset as the DRRs (generate_drr_brain.py
# PRESETS), so the autoencoder and the DDPM share one patient split.
# clean_subset.csv is the no-tilt ablation.
subset_csv: clean_subset_with_tilt.csv

# ensure no patient wise train-test leakage - near dups
split_by_patient: true

image_channels: 1
spatial_size: [128, 128, 96]

# intensity window mapped onto [-1,1]. Sets what fraction of the range brain
# contrast occupies, and therefore what the reconstruction loss prices.
hu_min: 0
hu_max: 100
